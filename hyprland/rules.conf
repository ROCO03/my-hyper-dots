# #######################################################################################
# SECCIÓN 1: REGLAS DE VENTANA (WINDOW RULES)
# #######################################################################################

# Optimización para Ryzen Vega 8: Desactivar blur y sombras en todo el sistema
windowrule {
    name = global-performance
    no_blur = on
    no_shadow = on
    match:class = .*
}

# Desactivar blur específicamente para menús de XWayland
windowrule {
    name = xwayland-fix
    no_blur = on
    match:class = ^()$
    match:title = ^()$
}

# Ventanas Flotantes y Centradas (Diálogos de Sistema y Office)
windowrule {
    name = system-dialogs
    float = on
    center = on
    # Agrupamos todas las ventanas comunes para limpiar el archivo
    match:title = ^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|Library|File Upload|Text Import)(.*)$
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueberry\.py|onlyoffice-desktopeditors)$
}

# Picture-in-Picture
windowrule {
    name = pip-mode
    float = on
    pin = on
    keep_aspect_ratio = on
    size = (monitor_w*0.25)
    move = ((monitor_w*0.73)) ((monitor_h*0.72))
    match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
}

# #######################################################################################
# SECCIÓN 2: RENDIMIENTO EN JUEGOS (TEARING)
# #######################################################################################

# Tearing inmediato y opacidad total para Dragon Ball Xenoverse 2 y Minecraft
windowrule {
    name = gaming-performance
    immediate = on
    opaque = on
    match:title = (.*\.exe|.*minecraft.*)
    match:class = ^(steam_app).*
}

# #######################################################################################
# SECCIÓN 3: REGLAS DE CAPAS (LAYER RULES - AGS, UI, QUICKSHELL)
# #######################################################################################

# Regla de Rayos X (Xray)
layerrule {
    name = layer-xray
    xray = 1
    match:namespace = .*
}

# Desactivar animaciones en Launchers para velocidad pura
layerrule {
    name = ui-speed
    no_anim = on
    match:namespace = ^(walker|selection|overview|anyrun|osk|hyprpicker|launcher|gtk4-layer-shell)$
}

# Blur y transparencia en Barra y Notificaciones
layerrule {
    name = ui-aesthetics
    blur = on
    ignore_alpha = 0.6
    match:namespace = ^(bar[0-9]*|notifications|dock[0-9]*|indicator.*)$
}

# Configuración específica para Quickshell
layerrule {
    name = quickshell-logic
    blur = on
    blur_popups = on
    ignore_alpha = 0.79
    match:namespace = quickshell:.*
}

# #######################################################################################
# SECCIÓN 4: PERSONALIZACIÓN Y WORKSPACES
# #######################################################################################

workspace = special:special, gapsout:30

# Guía de atajos (Cheatsheet de AGS)
windowrule {
    name = ags-cheatsheet
    float = on
    size = 800 600
    center = on
    match:class = (com.github.Aylur.ags)
    match:title = (Keybinds)
}
